name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Python 语法检查
        run: python -m py_compile server.py

      - name: 前端 JS 语法检查
        run: node --check web/app.js

      - name: manifest JSON 校验
        run: python -m json.tool web/manifest.webmanifest > /dev/null

      - name: service worker 语法检查
        run: node --check web/sw.js

      - name: 敏感信息自查（不应出现旧系统名与内网 IP）
        run: |
          if grep -rniE "wanos|hinas|histb|海纳思|mybox|casaos|192\.168\.2\.63" \
               --exclude-dir=.git --exclude-dir=.github --exclude="SHA256SUMS" .; then
            echo "::error::发现不应提交的内容"
            exit 1
          fi
          echo "敏感信息自查通过"
